name: Source and documentation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/build-guide.py --check
      - run: python -B -m unittest discover -s tools/tests -p 'test_*.py'
      - run: node --test lcpc/admin/tests/guide.test.cjs lcpc/admin/tests/workspace-nav.test.cjs
      - run: python tools/package-source.py --output /tmp/pc2-reviewed-source
