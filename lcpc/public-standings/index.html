<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'"><title>Public Scoreboard · LCPC OMU</title><link rel="stylesheet" href="/assets/lcpc-branding/standings.css?v=audience-2"><link rel="stylesheet" href="./scoreboards.css?v=audience-2"><link rel="stylesheet" href="/assets/lcpc-branding/participant-identity.css?v=1"><link rel="stylesheet" href="/assets/lcpc-branding/contest-clock.css?v=audience-2"><script src="/assets/lcpc-branding/scoreboard-model.js?v=audience-2" defer></script><script src="./scoreboards.js?v=audience-2" defer></script></head>
<body class="scoreboard-display"><header class="display-brand"><div class="display-contest"><p>LCPC OMU</p><h1 data-display-contest-title>Contest standings</h1></div><div class="display-logos"><img src="/assets/lcpc-branding/omu-logo.png" alt="Omar Al-Mukhtar University"><img src="/assets/lcpc-branding/lcpc-logo.png" alt="University programming contest"></div><div class="lcpc-contest-clock display-clock" data-contest-clock></div></header>
<main class="organizer-scoreboard audience-scoreboard" data-mode="public" data-public-display>
<div class="display-tools"><label class="display-search"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input type="search" data-team-search aria-label="Find team" placeholder="Find team" autocomplete="off"></label><div class="display-actions"><span data-scoreboard-state class="badge pending" role="status">Connecting</span><button type="button" data-fullscreen aria-label="Toggle full screen" title="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg></button></div></div>
<p data-scoreboard-error class="error-banner" role="alert" hidden></p><div data-scoreboard-table class="lcpc-full-standings"></div>
<footer class="display-footer"><p class="display-key"><span><b>+</b> Solved · time in minutes</span><span><b>−</b> Unsuccessful attempts</span><span><b>?</b> Pending</span><span><b>★</b> First to solve</span></p><time data-scoreboard-updated hidden></time></footer></main>
<script src="/assets/lcpc-branding/participant-identity.js?v=1" defer></script><script src="/assets/lcpc-branding/contest-clock.js?v=audience-2" defer></script></body></html>
